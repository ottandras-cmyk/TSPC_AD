<div class="card-box" style="background:white; padding:12px 16px; margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
        <div style="flex:1; min-width:320px;">
            <input type="text" id="dashboardGlobalSearch" placeholder="🔍 Globális gyorskeresés időpont, fiók, esemény vagy részletek szerint..." style="margin:0; padding:8px 12px; font-size:13px; width:100%; box-sizing:border-box;" onkeyup="filterAndSortDashboardEvents()">
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn" style="background:#0284c7; color:white; padding:6px 14px; font-size:12px; border-radius:6px; font-weight:bold;" onclick="loadDashboardEvents()">🔄 Frissítés</button>
            <button class="btn" style="background:#16a34a; color:white; padding:6px 14px; font-size:12px; border-radius:6px; font-weight:bold;" onclick="triggerManualSync()">⚡ Azonnali AD Letöltés</button>
            <button class="btn" style="background:#f1f5f9; color:#475569; padding:6px 14px; font-size:12px; border-radius:6px;" onclick="resetDashboardFilters()">Szűrők Törlése</button>
        </div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div>
            <label style="font-size:11.5px; font-weight:600; color:#475569; margin-bottom:3px; display:block;">🚦 Esemény Típus Szűrő:</label>
            <select id="dashboardEventTypeFilter" style="margin:0; padding:6px; font-size:12px; width:100%;" onchange="filterAndSortDashboardEvents()">
                <option value="ALL">Minden esemény típus</option>
            </select>
        </div>
        <div>
            <label style="font-size:11.5px; font-weight:600; color:#475569; margin-bottom:3px; display:block;">👤 Érintett Fiók Szűrő:</label>
            <input type="text" id="dashboardAccountFilter" placeholder="Szűrés felhasználói vagy csoport névre..." style="margin:0; padding:6px; font-size:12px; width:100%; box-sizing:border-box;" onkeyup="filterAndSortDashboardEvents()">
        </div>
    </div>
</div>

<div class="card-box" style="background:white; padding:12px 16px; overflow-x:auto;">
    <table>
        <thead>
            <tr>
                <th style="width:160px;">Időpont ▼</th>
                <th style="width:220px;">Érintett Fiók ⇅</th>
                <th style="width:160px;">Esemény ⇅</th>
                <th>Részletek ⇅</th>
            </tr>
        </thead>
        <tbody id="eventsTableBody">
            <tr><td colspan="4" style="text-align:center; padding:20px; color:#94a3b8;">Jogosultság változások betöltése...</td></tr>
        </tbody>
    </table>
</div>
